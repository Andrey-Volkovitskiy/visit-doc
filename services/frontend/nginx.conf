# The production counterpart of vite.config.ts's dev server: serve the built bundle, and
# forward the same API prefixes to chat. Keep the two lists of prefixes in step.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Prefix match, as in vite.config.ts: "/chat" also covers "/chats" and "/chats/{id}/messages".
    # "/admin" is deliberately absent: nothing in the browser calls it.
    location ~ ^/(chat|faq|console) {
        # `chat` is the service's hostname on the compose network.
        proxy_pass http://chat:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A reply streams token by token: buffering would hold it until the turn finished,
        # and a long turn must not be cut off by the default 60s read timeout.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Everything else is the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
