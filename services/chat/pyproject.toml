[project]
name = "chat"
version = "0.1.0"
description = "Core backend: agent, RAG, chat, and auth"
requires-python = ">=3.12"
dependencies = ["shared-models", "shared-proto"]

[tool.uv.sources]
shared-models = { workspace = true }
shared-proto = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat"]
