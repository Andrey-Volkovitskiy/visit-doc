services:
  postgres:
    image: postgres:16
    container_name: visitdoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visitdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visitdoc}
      POSTGRES_DB: ${POSTGRES_DB:-visitdoc}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visitdoc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    # Pin to a specific tag rather than `latest` so a `docker compose pull` doesn't silently
    # change your schema/API version underneath you; bump deliberately when you want to upgrade.
    image: qdrant/qdrant:v1.18.3
    container_name: visitdoc-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
