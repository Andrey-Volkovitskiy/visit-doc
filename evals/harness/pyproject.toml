[project]
name = "golden-harness"
version = "0.1.0"
description = "Drives the golden evaluation set through the running stack and scores the stored runs"
requires-python = ">=3.12"
dependencies = [
    "chat",
    "grpcio>=1.83.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.4",
    "python-ulid>=4.0.1",
    "scheduler",
    "shared-db",
    "shared-models",
    "shared-proto",
]

[tool.uv.sources]
chat = { workspace = true }
scheduler = { workspace = true }
shared-db = { workspace = true }
shared-models = { workspace = true }
shared-proto = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golden_harness"]
