# The cluster's front door: every request reaching Traefik - k3s's built-in Ingress
# controller, published at http://localhost:8080 by deploy/k3d.yaml - goes to the
# frontend, whose nginx serves the page and forwards the API prefixes to chat. The same
# one entry point the browser has in compose (:5173) and in development (Vite's proxy),
# so the page and the API share one origin: no CORS, and the session cookie is sent.
#
# Except the staff connector's addresses (spec 017), which go to chat directly. Claude's
# servers call them, not the page, and nginx forwards only the page's prefixes - so through
# nginx they would get the page's index.html. The connector is unavailable while chat's
# PUBLIC_BASE_URL is unset, as it is in the local cluster: there they answer 503, saying why.
# `/admin` is in neither list, and so reachable only from inside the cluster.
#
# No `host`: any hostname matches, so localhost works as it is. The public overlay
# names its domain here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: visitdoc
  namespace: visitdoc
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          # The longest matching path wins, so these take their prefixes from `/`.
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: chat
                port:
                  name: http
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: chat
                port:
                  name: http
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: chat
                port:
                  name: http
