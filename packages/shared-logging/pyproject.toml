[project]
name = "shared-logging"
version = "0.1.0"
description = "The one structlog processor chain every visit-doc service logs through"
requires-python = ">=3.12"
dependencies = ["structlog>=26.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_logging"]
