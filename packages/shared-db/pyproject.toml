[project]
name = "shared-db"
version = "0.1.0"
description = "Engine construction and migration URL handling shared by visit-doc services"
requires-python = ">=3.12"
dependencies = ["sqlalchemy[asyncio]>=2.0.51"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_db"]
