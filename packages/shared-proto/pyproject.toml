[project]
name = "shared-proto"
version = "0.1.0"
description = "Shared gRPC contract (protobuf) between the chat and scheduler services"
requires-python = ">=3.12"
dependencies = ["grpcio", "protobuf"]

[dependency-groups]
dev = ["grpcio-tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_proto"]
