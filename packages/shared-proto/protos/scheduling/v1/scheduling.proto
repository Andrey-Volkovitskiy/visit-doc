// chat <-> scheduler gRPC contract.
//
// Conventions:
//   * Every local date-time is an ISO-8601 string with NO offset and NO trailing `Z`
//     ("2026-08-14T09:00:00"); every local date is "YYYY-MM-DD"; every local time is "HH:MM".
//     `google.protobuf.Timestamp` is deliberately not used: it denotes an absolute instant, and
//     this system has no timezone (spec FR-033/FR-043, research.md #5). Both ends validate.
//   * Every request carries `session_id`. The server scopes every query to it and never returns a
//     row from another session (spec FR-002). Because the scoping is a filter rather than a
//     post-hoc check, an id belonging to another session simply does not resolve — it is reported
//     as not-found, identically to one that never existed (spec FR-066).
//   * Every request that makes a judgement about "past", "upcoming", or the booking horizon carries
//     `local_now`, the client's current local date-time. The server never reads its own clock for
//     such a judgement (spec FR-058, research.md #20).
//   * A refusal the server evaluated is a SUCCESSFUL rpc carrying a typed failure. gRPC status
//     codes are reserved for transport/infrastructure failures (research.md #9).
//   * The caller applies a 2s deadline and at most 2 attempts per call, with a short pause between
//     them, retrying only UNAVAILABLE and DEADLINE_EXCEEDED (spec FR-047). A deadline is the
//     caller's, not the server's: an exhausted budget does NOT prove the request went unprocessed,
//     so a caller that gives up on a write must not report that nothing was written.
//   * `x-turn-id` metadata carries the caller's correlation id (research.md #18).

syntax = "proto3";

package scheduling.v1;

service Scheduling {
  // Idempotent per-session provisioning: creates this chat's patient if absent, and one
  // default practitioner if the session has none. Safe to call on every visit (FR-042, FR-045).
  // NOT_FOUND when `chat_id` already belongs to a patient of another session: the chat is unique
  // across the whole store, so a mismatched one is never answered with that patient.
  rpc EnsureSessionProvisioned(EnsureSessionProvisionedRequest)
      returns (EnsureSessionProvisionedResponse);

  // Rename one patient. Idempotent: renaming to the name it already has succeeds and
  // changes nothing, so a caller whose deadline expired may safely retry.
  rpc RenamePatient(RenamePatientRequest) returns (RenamePatientResponse);

  // Every practitioner in the session, with specialty and schedule (FR-030).
  rpc ListPractitioners(ListPractitionersRequest) returns (ListPractitionersResponse);

  // Bookable start times for one practitioner over a window (FR-024).
  // NOT_FOUND when the practitioner or the patient does not resolve in this session:
  // this response has no typed-failure channel, and an empty result already means
  // something else entirely (see CheckAvailabilityResponse.truncated). The status
  // DETAIL carries which one failed, as a `shared_models.NotFoundEntity` value —
  // NOT_FOUND has no typed payload, so the detail string is that part of the contract.
  // INVALID_ARGUMENT when `to_date` precedes `from_date`, which would otherwise walk
  // zero days and answer with that same "nothing bookable" shape.
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);

  // Create one appointment, or explain why it was refused (FR-016..FR-021, FR-051).
  rpc BookAppointment(BookAppointmentRequest) returns (BookAppointmentResponse);

  // Move an appointment: a new start, and optionally a new practitioner, applied together as
  // one write (006 FR-001..FR-003). The appointment keeps its identifier and its patient.
  //
  // Carries NO idempotency key, deliberately (006 FR-020): the request asserts the state the
  // appointment is to end in, so re-sending it cannot bring a second appointment into being. A
  // key derived from that target state would be worse than none — states recur, and
  // 09:00 -> 10:00 -> 09:00 -> 10:00 would derive the first move's key on the third and replay
  // it, leaving the appointment at 09:00 while reporting success.
  rpc RescheduleAppointment(RescheduleAppointmentRequest) returns (ChangeAppointmentResponse);

  // Cancel an appointment. The record is retained and marked cancelled (006 FR-009): it keeps
  // its identifier, its practitioner and its times, stops occupying its slot (006 FR-010), and
  // releases the idempotency key that created it (006 FR-011).
  //
  // Cancelling an already-cancelled appointment returns `no_change`, NOT a failure — the
  // appointment is in the state that was asked for (006 FR-017, FR-019). This is
  // distinguishable from an appointment that never existed, which is
  // `failure(APPOINTMENT_NOT_FOUND)`.
  rpc CancelAppointment(CancelAppointmentRequest) returns (ChangeAppointmentResponse);

  // This patient's appointments: two independent axes in, two separately bounded legs out
  // (006 FR-013..FR-016). Replaces `ListUpcomingAppointments`, whose FUTURE + STANDING corner
  // is exactly what it returned.
  //
  // NOT_FOUND (detail: `NotFoundEntity.PATIENT`) when the patient does not resolve in this
  // session — two empty legs mean the patient exists and has nothing matching, and one value
  // must not stand for both.
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse);

  // Hard-delete this chat's patient and, by cascade, that patient's appointments (FR-039).
  // Idempotent: deleting an already-absent patient succeeds.
  rpc DeletePatientForChat(DeletePatientForChatRequest) returns (DeletePatientForChatResponse);
}

// ---------------------------------------------------------------------------
// Domain messages
// ---------------------------------------------------------------------------

// A specialty is one of the ten values of `shared_models.Specialty` (spec FR-005) — carried as a
// `string`, deliberately NOT a proto enum (research.md #25). The StrEnum in `shared-models` is the
// single declaration of the set; a proto enum would be a second one that could drift, and adding an
// eleventh specialty would then mean regenerating stubs on both sides. Both ends validate the string
// against that enum on ingress and reject anything outside it with INVALID_ARGUMENT. An empty string
// on a create request means "use the default", which is "General Practice" (FR-057).

// 0 = Monday .. 6 = Sunday.
enum Weekday {
  WEEKDAY_MONDAY = 0;
  WEEKDAY_TUESDAY = 1;
  WEEKDAY_WEDNESDAY = 2;
  WEEKDAY_THURSDAY = 3;
  WEEKDAY_FRIDAY = 4;
  WEEKDAY_SATURDAY = 5;
  WEEKDAY_SUNDAY = 6;
}

// One continuous span on one weekday during which a practitioner accepts appointments.
message WorkingRange {
  Weekday weekday = 1;
  string start_time = 2;  // "HH:MM"
  string end_time = 3;    // "HH:MM", strictly after start_time
}

message Patient {
  string id = 1;
  string chat_id = 2;
  string full_name = 3;
}

message Practitioner {
  string id = 1;
  string full_name = 2;
  string specialty = 3;  // one of the ten Specialty values
  int32 appointment_duration_minutes = 4;
  repeated WorkingRange schedule = 5;  // empty => listed but never bookable
}

// Whether an appointment still counts, or was called off but kept. Every listing that can
// contain a cancelled appointment must identify it as cancelled (006 FR-015), and a caller must
// never have to infer status from absence. Mirrors `shared_models.AppointmentStatus` 1:1.
enum AppointmentStatus {
  APPOINTMENT_STATUS_UNSPECIFIED = 0;
  APPOINTMENT_STATUS_STANDING = 1;
  APPOINTMENT_STATUS_CANCELLED = 2;
}

message Appointment {
  string id = 1;
  string patient_id = 2;
  string patient_full_name = 3;
  string practitioner_id = 4;
  string practitioner_full_name = 5;
  string practitioner_specialty = 6;  // one of the ten Specialty values
  string starts_at = 7;  // local, "YYYY-MM-DDTHH:MM:SS"
  string ends_at = 8;    // local
  AppointmentStatus status = 9;
}

// Why an evaluated booking was refused. Mirrors `shared_models.BookingFailureReason` 1:1, and is
// exactly the closed set of eight FR-065 allows — every value here maps to one rejection rule, and
// every rejection rule has a value here.
//
// An attempt can break several rules at once, so the server evaluates them in FR-065's fixed
// precedence and reports the FIRST that holds:
//   NOT_FOUND (either) -> IN_PAST -> BEYOND_HORIZON -> OUTSIDE_SCHEDULE -> OFF_GRID -> BUSY (either).
// Two consequences worth stating: a start inside NO working range is OUTSIDE_SCHEDULE and never
// OFF_GRID (off-grid presupposes a range to be off the grid of), and the two BUSY reasons come from
// the datastore's exclusion constraints at insert time, so when one attempt collides with both,
// either may be reported.
enum BookingFailureReason {
  BOOKING_FAILURE_REASON_UNSPECIFIED = 0;
  BOOKING_FAILURE_REASON_PRACTITIONER_BUSY = 1;      // FR-017
  BOOKING_FAILURE_REASON_PATIENT_BUSY = 2;           // FR-016
  BOOKING_FAILURE_REASON_OUTSIDE_SCHEDULE = 3;       // FR-018, incl. an appointment spanning two
                                                     //   contiguous ranges, and any start outside
                                                     //   every range
  BOOKING_FAILURE_REASON_OFF_GRID = 4;               // FR-019, only inside a range
  BOOKING_FAILURE_REASON_IN_PAST = 5;                // FR-020, start <= local_now (boundary refused)
  BOOKING_FAILURE_REASON_BEYOND_HORIZON = 6;         // FR-021, start > local_now + 90d (inclusive)
  BOOKING_FAILURE_REASON_PRACTITIONER_NOT_FOUND = 7; // incl. another session's id (FR-066)
  BOOKING_FAILURE_REASON_PATIENT_NOT_FOUND = 8;      // incl. a patient deleted mid-turn (FR-055),
                                                     //   and another session's id (FR-066)
}

message BookingFailure {
  BookingFailureReason reason = 1;
  // Human-readable detail for logs only. The assistant's explanation to the patient is generated
  // from `reason`, never from this string.
  string detail = 2;
}

// Why a rename was refused. Both are outcomes the server evaluated, so both travel as a
// successful rpc carrying this failure rather than as a gRPC status code.
enum RenameFailureReason {
  RENAME_FAILURE_REASON_UNSPECIFIED = 0;
  RENAME_FAILURE_REASON_NAME_TAKEN = 1;         // another patient in this session holds that name
  RENAME_FAILURE_REASON_PATIENT_NOT_FOUND = 2;  // incl. another session's id (FR-066)
}

message RenameFailure {
  RenameFailureReason reason = 1;
  // Human-readable detail for logs only, never rendered to the patient.
  string detail = 2;
}

// Why an evaluated change was refused. Twelve values: this feature's own four, then booking's
// eight unchanged in meaning and in `shared_models` string value. Mirrors
// `shared_models.ChangeFailureReason` 1:1.
//
// Evaluated in this precedence, first match reported. The four come first because each settles
// whether the appointment can be changed at all, before any question of where it may go is
// worth asking:
//
//   APPOINTMENT_NOT_FOUND -> ALREADY_CANCELLED -> ALREADY_STARTED -> STALE_CONFIRMATION
//     -> PRACTITIONER_NOT_FOUND / PATIENT_NOT_FOUND -> IN_PAST -> BEYOND_HORIZON
//     -> OUTSIDE_SCHEDULE -> OFF_GRID -> PRACTITIONER_BUSY / PATIENT_BUSY
//
// ALREADY_STARTED is NOT IN_PAST. IN_PAST is about the new start being asked for;
// ALREADY_STARTED is about the appointment's CURRENT start, and an appointment that has begun is
// refused even when the time it is asked to move to is perfectly valid (006 FR-005 vs FR-006).
//
// A CANCELLATION can only be refused by the first four; it places nothing, so booking's eight
// are unreachable for it. ALREADY_CANCELLED is reachable only for a RESCHEDULE — for a
// cancellation that state is the target state, and the answer is `no_change`.
enum ChangeFailureReason {
  CHANGE_FAILURE_REASON_UNSPECIFIED = 0;
  CHANGE_FAILURE_REASON_APPOINTMENT_NOT_FOUND = 1;   // incl. another session's id (006 FR-018)
  CHANGE_FAILURE_REASON_ALREADY_CANCELLED = 2;       // 006 FR-005, reschedule only
  CHANGE_FAILURE_REASON_ALREADY_STARTED = 3;         // 006 FR-005, current start <= local_now
  CHANGE_FAILURE_REASON_STALE_CONFIRMATION = 4;      // 006 FR-021
  CHANGE_FAILURE_REASON_PRACTITIONER_NOT_FOUND = 5;
  CHANGE_FAILURE_REASON_PATIENT_NOT_FOUND = 6;
  CHANGE_FAILURE_REASON_IN_PAST = 7;                 // the NEW start
  CHANGE_FAILURE_REASON_BEYOND_HORIZON = 8;
  CHANGE_FAILURE_REASON_OUTSIDE_SCHEDULE = 9;
  CHANGE_FAILURE_REASON_OFF_GRID = 10;
  CHANGE_FAILURE_REASON_PRACTITIONER_BUSY = 11;
  CHANGE_FAILURE_REASON_PATIENT_BUSY = 12;
}

message ChangeFailure {
  ChangeFailureReason reason = 1;
  // Human-readable detail for logs only. The assistant's explanation to the patient is
  // generated from `reason`, never from this string.
  string detail = 2;
}

// The appointment was already in the state the request asked for, so nothing was written
// (006 FR-019). A separate outcome from `appointment` because the caller must be able to tell
// one move from a move re-sent: the log carries one change record per real transition, and this
// one instead (006 FR-040).
message NoChange {
  Appointment appointment = 1;  // as it stands, which is the state that was asked for
}

// ---------------------------------------------------------------------------
// RPC messages
// ---------------------------------------------------------------------------

message EnsureSessionProvisionedRequest {
  string session_id = 1;
  string chat_id = 2;
}

message EnsureSessionProvisionedResponse {
  Patient patient = 1;
  repeated Practitioner practitioners = 2;  // the session's full set, not only any newly created one
  bool patient_created = 3;                 // false when an earlier attempt had already created it
  bool practitioner_created = 4;
}

message RenamePatientRequest {
  string session_id = 1;
  string patient_id = 2;
  string full_name = 3;  // 1..200 chars, matching the REST surface's own PatientUpdate bounds
}

message RenamePatientResponse {
  oneof result {
    Patient patient = 1;  // the patient as stored after the rename
    RenameFailure failure = 2;
  }
}

message ListPractitionersRequest {
  string session_id = 1;
}

message ListPractitionersResponse {
  repeated Practitioner practitioners = 1;
}

message CheckAvailabilityRequest {
  string session_id = 1;
  string practitioner_id = 2;
  string from_date = 3;   // local, "YYYY-MM-DD", inclusive
  // local, "YYYY-MM-DD", inclusive. A window longer than FR-067's 14-day cap is CLAMPED to 14 days
  // from `from_date`, never rejected, and the response is marked `truncated`.
  string to_date = 4;
  string local_now = 5;   // FR-058
  // REQUIRED. Availability is patient-relative (FR-024): slots colliding with this patient's own
  // appointments — with ANY practitioner — are excluded, so an offered slot can never be refused by
  // FR-016's patient-overlap rule. Omitting it would reintroduce that gap, so it is not optional.
  string patient_id = 6;
  // OPTIONAL. When set, this appointment is omitted from BOTH the practitioner's and the
  // patient's existing commitments while computing availability, so an appointment never blocks
  // its own change — including a change to the time it already holds (006 FR-007).
  //
  // Scoped to the session like every other id: an appointment id from another session excludes
  // nothing, rather than revealing that it exists.
  //
  // Only the OFFER path needs this. On the write path an exclusion constraint compares distinct
  // rows, so an UPDATE is never checked against the row's own previous interval.
  string excluded_appointment_id = 7;
}

message CheckAvailabilityResponse {
  // Bookable start times, ascending, local. Each is guaranteed bookable BY THIS PATIENT at the
  // moment it is produced (FR-025/SC-009): inside ONE working range, on that range's grid, free for
  // the practitioner, free for the patient, strictly after `local_now`, in horizon. Every predicate
  // is evaluated exactly as `BookAppointment` evaluates it, boundaries included — a slot starting at
  // exactly `local_now` is NOT offered, because FR-020 would refuse it. Intervals are half-open
  // (FR-061), so a slot starting exactly when the patient's previous appointment ends IS offered.
  // Grandfathered appointments (FR-023) remove the slots they overlap like any other appointment;
  // they merely never appear as offers themselves, since the grid comes from the CURRENT schedule.
  // The guarantee is scoped to the moment of production — another patient may take a slot before
  // this one confirms.
  repeated string available_starts = 1;
  // True when either FR-067 cap bit: the requested window was clamped to 14 days, or more than 50
  // starts existed. An empty list with `truncated = false` therefore means genuinely nothing
  // bookable in that window, which is what lets the caller tell "fully booked" from "not all seen".
  // It never means "no such practitioner": that is NOT_FOUND, so the caller can say which of the
  // two happened rather than offering to look further ahead for an id that will never resolve.
  bool truncated = 2;
  int32 appointment_duration_minutes = 3;
}

message BookAppointmentRequest {
  string session_id = 1;
  string patient_id = 2;
  string practitioner_id = 3;
  string starts_at = 4;        // local; `ends_at` is derived server-side from the practitioner
  string local_now = 5;        // FR-058
  // Required, caller-derived from exactly (patient_id, practitioner_id, starts_at) so that the same
  // booking always yields the same key and different bookings never share one (FR-062).
  //
  //   * key unused                         -> validate and create; the key is recorded ONLY on
  //                                           success, so a refusal leaves it free (FR-064)
  //   * key used, all three fields match   -> return that appointment, idempotent_replay = true
  //                                           (FR-051)
  //   * key used, any field differs        -> INVALID_ARGUMENT (FR-063). NOT a BookingFailure: it
  //                                           means the caller's key derivation is broken, not that
  //                                           the patient must choose differently. Returning the
  //                                           stored appointment here would confirm a time the
  //                                           patient never asked for (FR-028).
  //
  // Globally scoped; lives exactly as long as the appointment that recorded it (FR-064).
  string idempotency_key = 6;
}

message BookAppointmentResponse {
  oneof result {
    Appointment appointment = 1;  // created now, OR the original for an already-used key
    BookingFailure failure = 2;
  }
  // True when `idempotency_key` matched an earlier attempt and `appointment` is that original.
  // Diagnostic only: the caller reports it to the patient identically either way (FR-051).
  bool idempotent_replay = 3;
}

// The two guard fields are on BOTH change requests. They carry the start date-time and
// practitioner the appointment had at the moment the assistant described it to the patient, and
// the server compares them as part of the write, never before it (006 FR-021). The comparison
// passes when the appointment matches EITHER the described state OR the target state the request
// asks for — the second arm is what makes a re-send safe rather than a false conflict.
message RescheduleAppointmentRequest {
  string session_id = 1;
  string patient_id = 2;
  string appointment_id = 3;
  string new_starts_at = 4;             // local; `ends_at` is derived server-side (006 FR-004)
  // Empty means "keep the practitioner it has". When set, the practitioner, start and end change
  // together in one write (006 FR-002, FR-003) — never a cancellation plus a new booking.
  string new_practitioner_id = 5;
  string expected_starts_at = 6;        // guard (006 FR-021)
  string expected_practitioner_id = 7;  // guard (006 FR-021)
  string local_now = 8;                 // 006 FR-005, FR-006, FR-035
}

message CancelAppointmentRequest {
  string session_id = 1;
  string patient_id = 2;
  string appointment_id = 3;
  string expected_starts_at = 4;        // guard (006 FR-021) — applies to cancellation too
  string expected_practitioner_id = 5;  // guard (006 FR-021)
  string local_now = 6;                 // 006 FR-005
}

// Shared by both change RPCs: the three outcomes a change can have.
message ChangeAppointmentResponse {
  oneof result {
    Appointment appointment = 1;  // the write took effect; the appointment as it now stands
    NoChange no_change = 2;       // already in the state asked for
    ChangeFailure failure = 3;    // one reason, by the precedence above
  }
  // Present only alongside `appointment`, and only for a reschedule that actually moved
  // something. The server is the only party that knows both sides of the write atomically, and
  // 006 FR-036/FR-038 need both. Not a convenience: reading the "before" separately would
  // describe a state a concurrent change may already have replaced.
  string previous_starts_at = 4;
  string previous_practitioner_id = 5;
}

message ListAppointmentsRequest {
  string session_id = 1;
  string patient_id = 2;
  string local_now = 3;  // decides which leg an appointment falls in (006 FR-035)
  TimeFilter time_filter = 4;
  StatusFilter status_filter = 5;
}

// The zero values are the NARROWEST corner of the grid, deliberately. proto3 gives every enum an
// unavoidable default, and 006 FR-014 says the unqualified question returns future AND standing —
// so an unset filter can only ever narrow, never widen. A caller that forgets to set these gets
// the safe answer instead of a patient's cancelled history.
enum TimeFilter {
  TIME_FILTER_FUTURE = 0;  // starts strictly after local_now
  TIME_FILTER_PAST = 1;    // starts at or before local_now, incl. one under way
  TIME_FILTER_BOTH = 2;
}

enum StatusFilter {
  STATUS_FILTER_STANDING = 0;
  STATUS_FILTER_CANCELLED = 1;
  STATUS_FILTER_BOTH = 2;
}

// Two legs, bounded and ordered separately (006 FR-016). They are separate fields rather than one
// list so that neither can crowd the other out of a listing the patient explicitly asked for:
// twenty future appointments cannot consume a cap that exists because PAST appointments
// accumulate without limit.
message ListAppointmentsResponse {
  repeated Appointment future = 1;  // ascending; unbounded, since the 90-day horizon bounds it
  repeated Appointment past = 2;    // descending (most recent first); at most 20
  // True when the past leg elided some. Scoped to that leg alone, so it can never be read as
  // "the whole answer is partial".
  bool past_truncated = 3;
}

message DeletePatientForChatRequest {
  string session_id = 1;
  string chat_id = 2;
}

message DeletePatientForChatResponse {
  bool patient_existed = 1;
  int32 appointments_deleted = 2;
}
