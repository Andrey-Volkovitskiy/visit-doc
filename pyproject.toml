[tool.uv.workspace]
members = ["services/chat", "services/scheduler", "packages/*"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "mypy",
    "types-protobuf>=7.34.1.20260518",
    "types-grpcio>=1.82.1.20260724",
    "pre-commit>=4.6.1",
]

[tool.ruff]
extend-exclude = ["**/*_pb2.py", "**/*_pb2_grpc.py"]

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely-bug patterns)
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
    "D101", # missing docstring in public class
    "D102", # missing docstring in public method
    "D103", # missing docstring in public function
]

[tool.mypy]
python_version = "3.12"
mypy_path = "services/chat/src:services/scheduler/src:packages/shared-models/src:packages/shared-proto/src"
files = [
    "services/chat/src",
    "services/scheduler/src",
    "packages/shared-models/src",
    "packages/shared-proto/src",
]
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = "shared_proto.scheduling.v1.*"
ignore_errors = true
