[tool.uv.workspace]
members = ["services/chat", "services/scheduler", "packages/*"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "mypy",
    "types-protobuf>=7.34.1.20260518",
    "types-grpcio>=1.82.1.20260724",
    "pre-commit>=4.6.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
extend-exclude = [
    "**/*_pb2.py",
    "**/*_pb2.pyi",
    "**/*_pb2_grpc.py",
    "**/alembic/versions/*.py",
]

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely-bug patterns)
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
    "D101", # missing docstring in public class
    "D102", # missing docstring in public method
    "D103", # missing docstring in public function
]

ignore = [
    # This system stores and reasons about *local wall-clock* times only - no timezone
    # is stored, converted, or configurable anywhere, and every past/upcoming/horizon
    # judgement is made against a client-supplied `local_now`. A naive `datetime(...)`
    # is therefore the correct, intended construction here, not an oversight. Only
    # DTZ001 (the constructor) is ignored: the rest of the flake8-datetimez family stays
    # on, and is genuinely useful - DTZ005/DTZ011 in particular forbid reading the host
    # clock, which is exactly the mistake the local-time model must not make.
    "DTZ001",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D101", "D102", "D103"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers -ra"
asyncio_mode = "auto"
# The chat service's SQLAlchemy async engine (chat.db.session) is a module-level singleton
# whose connection pool binds to the first event loop that uses it; a session-scoped loop
# keeps every async test on that same loop instead of a fresh one per test (which would
# otherwise raise "Future attached to a different loop" on the second test that touches it).
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = [
    "services/chat/tests",
    "services/scheduler/tests",
    "packages/shared-logging/tests",
    "packages/shared-models/tests",
    "packages/shared-proto/tests",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
mypy_path = "services/chat/src:services/scheduler/src:packages/shared-db/src:packages/shared-logging/src:packages/shared-models/src:packages/shared-proto/src"
files = [
    "services/chat/src",
    "services/scheduler/src",
    "packages/shared-db/src",
    "packages/shared-logging/src",
    "packages/shared-models/src",
    "packages/shared-proto/src",
]
explicit_package_bases = true
strict = true
exclude = ["(^|/)tests/"]

[[tool.mypy.overrides]]
module = "shared_proto.scheduling.v1.*"
ignore_errors = true
